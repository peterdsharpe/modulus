# DrivAerML surface in RANDOM POSE (POSE-BENCH, transfer program campaign B,
# 2026-09-09). Identical to drivaer_ml_surface.yaml except:
#   * the reader stores a stable per-case integer `case_key`;
#   * `FixedRandomPose` rotates every case (train AND validation) by a uniform
#     SO(3) rotation that is a deterministic function of the case, applied as a
#     TRANSFORM before the freestream direction is computed, so positions,
#     normals, wall shear, U_inf and U_inf_dir rotate together and every
#     architecture is scored on the same posed validation set;
#   * the augmentation block (used only with `augment=true`, i.e. by the
#     baselines) is a uniform SO(3) rotation instead of the z-axis one, applied
#     after CenterMesh as the recipe does; ISLA trains with `augment=false`.
# With `augment=true` the recipe builds an un-augmented validation dataset in
# manifest mode, so validation stays the fixed posed benchmark.

train_datadir: ${dataset_paths.drivaer_ml}

pipeline:
  reader:
    _target_: ${dp:MeshReaderWithGlobalData}
    path: ${train_datadir}
    pattern: "run_*/*.pdmsh/_tensordict/boundaries/vehicle"
    subsample_n_cells: ${sampling_resolution}
    merge_global_data_from: "../../global_data"
    store_case_key: true
  augmentations:
    - _target_: ${dp:RandomRotateMesh}
      mode: uniform
      transform_cell_data: true
      transform_global_data: true
  transforms:
    - _target_: ${dp:DropMeshFields}
      global_data: [TimeValue]
    - _target_: ${dp:FixedRandomPose}
      salt: 0
    - _target_: ${dp:ComputeFreestreamDirection}
      velocity_field: U_inf
      output_field: U_inf_dir
    - _target_: ${dp:CenterMesh}
      use_area_weighting: false
      store_center_as: center
    - _target_: ${dp:NonDimensionalizeByMetadata}
      fields:
        pMeanTrim: pressure
        wallShearStressMeanTrim: stress
      association: cell_data
    - _target_: ${dp:RenameMeshFields}
      cell_data:
        pMeanTrim: pressure
        wallShearStressMeanTrim: wss
    - _target_: ${dp:NormalizeMeshFields}
      association: cell_data
      fields:
        wss: {type: vector, mean: [0.0, 0.0, 0.0], std: 0.00313}
    - _target_: ${dp:ComputeSurfaceNormals}
      store_as: cell_data
      field_name: normals
    - _target_: ${dp:SubsampleMesh}
      n_cells: ${sampling_resolution}
    - _target_: ${dp:DropDegenerateCells}
    - _target_: ${dp:SetGlobalField}
      fields:
        reference_length: 8.0
    - _target_: ${dp:MeshToDomainMesh}

targets:
  pressure: scalar
  wss: vector
